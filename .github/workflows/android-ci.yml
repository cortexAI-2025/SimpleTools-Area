name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          if [[ -f "$sdk_root/platforms/android-36/android.jar" && -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            exit 0
          fi
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;35.0.0"

      - name: Compile, lint, unit tests, debug APK and unsigned release bundle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:compileDebugKotlin :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease \
            2>&1 | tee build.log

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for file in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              suite = ET.parse(file).getroot()
              total += int(suite.attrib['tests'])
              failed += int(suite.attrib['failures']) + int(suite.attrib['errors'])
              skipped += int(suite.attrib['skipped'])
          print(f"### Tests unitaires\n\n{total - skipped} exécutés · {failed} échecs · {skipped} ignorés")
          PY

      - name: Name the APK with version and commit
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SimpleTools-Area-${VERSION}-${GITHUB_SHA::7}-debug.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTools-Area-debug-apk
          path: dist/
          if-no-files-found: error

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTools-Area-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-reports
          path: |
            build.log
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
